<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · {{ brand_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #0B0B0D; color: #F4F1EA; font: 15px/1.5 Inter, system-ui, sans-serif; }
    .box { width: 100%; max-width: 380px; background: #141417; border: 1px solid #26262C; border-radius: 16px; padding: 30px; }
    .mark { width: 40px; height: 40px; border-radius: 10px; background: #C6FF3D; color: #0E0E10; display: grid; place-items: center; font: 700 19px "Space Grotesk", sans-serif; margin-bottom: 18px; }
    h1 { font: 700 22px "Space Grotesk", sans-serif; margin: 0 0 4px; }
    p { margin: 0 0 22px; color: #9A978F; font-size: 14px; }
    label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
    input { width: 100%; background: #0B0B0D; border: 1px solid #33333B; color: #F4F1EA; border-radius: 10px; padding: 11px 12px; font: 15px Inter, sans-serif; }
    input:focus { outline: none; border-color: #C6FF3D; box-shadow: 0 0 0 3px rgba(198,255,61,.12); }
    button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 10px; background: #C6FF3D; color: #0E0E10; font: 600 15px Inter, sans-serif; cursor: pointer; }
    .err { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35); padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <form class="box" method="post">
    <div class="mark">{{ brand_name[:1] }}</div>
    <h1>{{ brand_name }}</h1>
    <p>İçerik paneline giriş</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="pw">Şifre</label>
    <input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit">Giriş yap</button>
  </form>
</body>
</html>
